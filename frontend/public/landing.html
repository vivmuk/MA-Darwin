<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MA-Darwin · How do skills evolve?</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background:
          linear-gradient(90deg, rgba(0, 109, 119, 0.06) 1px, transparent 1px),
          linear-gradient(rgba(0, 109, 119, 0.06) 1px, transparent 1px),
          #f7f4ea;
        background-size: 28px 28px, 28px 28px, auto;
        color: #173f3c;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .landing-poster {
        height: 100svh; min-height: 100svh; overflow: hidden;
        display: flex; flex-direction: column;
      }
      .landing-poster__stage {
        flex: 1; min-height: 0; width: 100%;
        display: flex; align-items: center; justify-content: center;
        padding: 8px 12px 0;
      }
      .landing-poster__image {
        display: block; width: 100%;
        height: calc(100svh - 7rem); max-height: calc(100svh - 7rem);
        object-fit: contain; object-position: center; background: transparent;
      }
      .landing-poster__bar {
        flex-shrink: 0; display: flex; justify-content: center;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        border-top: 3px solid #006d77; background: rgba(247, 244, 234, 0.96);
      }
      .landing-poster__demo {
        display: inline-flex; align-items: center; justify-content: center;
        width: min(100%, 36rem); min-height: 4.5rem; padding: 0 2rem;
        border-radius: 8px; background: #006d77; color: #fffdf6;
        font-size: clamp(1.5rem, 4vw, 2.25rem); font-weight: 800;
        letter-spacing: 0.06em; text-decoration: none; text-transform: uppercase;
        box-shadow: 5px 7px 0 #d81b60;
      }
      .landing-poster__demo:hover { transform: translateY(-2px); background: #08565e; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <div class="landing-poster">
      <main class="landing-poster__stage">
        <h1 class="sr-only">MA-Darwin: How do skills evolve?</h1>
        <img
          class="landing-poster__image"
          src="/ma-darwin-how-skills-evolve.png"
          alt="MA-DARWIN infographic: How do skills evolve? From simple rules to emergent behavior to selected, inheritable capability."
        />
      </main>
      <footer class="landing-poster__bar">
        <a class="landing-poster__demo" href="/app/">Demo</a>
      </footer>
    </div>
  </body>
</html>
