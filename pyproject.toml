[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-darwin"
version = "0.1.0"
description = "Medical affairs deck generation with claim ledger, gates, and skill evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "python-pptx>=1.0.0",
  "pymupdf>=1.24.0",
  "pyyaml>=6.0.1",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "cairosvg>=2.7.0",
  "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[project.scripts]
ma-darwin = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
